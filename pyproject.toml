[project]
name = "tg-media-download"
version = "0.1.0"
description = "Download media of a specified type from a Telegram entity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36.0",
    "pysocks>=1.7.1",
    "cryptg>=0.4.0",
    "progressbar2>=4.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-spec>=6.1.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=4.0.0",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
spec_header_format = "Case: {test_case}\nPath: {module_path}"
spec_test_format = '{result} {docstring_summary}'
spec_success_indicator = '✓'
spec_failure_indicator = '✗'
spec_skipped_indicator = '↷'
asyncio_mode = 'auto'

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "W", "Q"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


